name: P256WalletDemo
options:
  bundleIdPrefix: com.aziz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9AJKD9KA2B
    SWIFT_VERSION: 5.10
  configs:
    Debug:
      ENABLE_TESTABILITY: true
      ONLY_ACTIVE_ARCH: true
      SWIFT_OPTIMIZATION_LEVEL: -Onone
targets:
  P256WalletDemo:
    type: application
    platform: iOS
    sources: [P256WalletDemo]
    info:
      path: P256WalletDemo/Info.plist
      properties:
        CFBundleDisplayName: P256 Wallet Demo
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Approve P-256 wallet operations with Face ID.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aziz.p256walletdemo
        CODE_SIGN_STYLE: Automatic
  P256WalletDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [P256WalletDemoTests]
    dependencies:
      - target: P256WalletDemo
schemes:
  P256WalletDemo:
    build:
      targets:
        P256WalletDemo: all
        P256WalletDemoTests: [test]
    test:
      targets:
        - P256WalletDemoTests
