name: P256WalletDemo
options:
  bundleIdPrefix: dev.demo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  P256WalletDemo:
    type: application
    platform: iOS
    sources: [P256WalletDemo]
    info:
      path: P256WalletDemo/Info.plist
      properties:
        CFBundleDisplayName: P256 Wallet Demo
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Approve P-256 wallet operations with Face ID.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.demo.P256WalletDemo
        CODE_SIGN_STYLE: Automatic
  P256WalletDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [P256WalletDemoTests]
    dependencies:
      - target: P256WalletDemo

