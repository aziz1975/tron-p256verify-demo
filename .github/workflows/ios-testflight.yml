name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  test-archive-upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: ios/P256WalletDemo.xcodeproj
      SCHEME: P256WalletDemo
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_PRIVATE_KEY"
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
          test -n "$P12_PASSWORD"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run iOS unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            iphone = devices.find { |device| device.fetch("name", "").start_with?("iPhone") }
            abort "No available iPhone simulator was found" unless iphone
            puts iphone.fetch("udid")
          ')"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install App Store Connect API key
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/P256WalletDemo.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed application
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/P256WalletDemo.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=9AJKD9KA2B \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/P256WalletDemo.xcarchive" \
            -exportPath "$RUNNER_TEMP/P256WalletDemoExport" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if test -n "${SIGNING_KEYCHAIN_PATH:-}"; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-distribution-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/P256WalletDemoExport
          if-no-files-found: ignore
          retention-days: 7
